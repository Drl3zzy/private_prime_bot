name: Prime habit bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prime-habit-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot tick
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py

      - name: Commit state if changed
        run: |
          git config user.name "prime-habit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json answers.json
          git diff --cached --quiet || git commit -m "bot tick $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
