name: Prime habit bot

on:
  schedule:
        - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prime-habit-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot tick
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py

      - name: Commit state if changed
        run: |
          git config user.name "prime-habit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json answers.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "bot tick $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then
              echo "push failed after $n attempts"
              exit 1
            fi
            echo "push rejected, rebasing onto latest main (attempt $n)"
            git fetch origin main
            git rebase origin/main
          done
